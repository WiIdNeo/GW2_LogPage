# Sabetha

[boss."15375".role."Flak Kite"]
description = "hat das Flak aus der Gruppe herausgekitet"
criteria = [
  { source = "mechanic", name = "Flak", top = 1, min_total = 10 },
]

[boss."15375".mechanic."Flak"]
critical = 3
not_roles = ["Flak Kite"]
list_if_not_critical = false
text_if_listed_critical = "Du hast übermäßig viel im Flak gestanden. Achte daruaf, dass du nicht in den Flak-AoEs stehst."

[boss."15375".mechanic."Cannon"]
critical = 2
list_if_not_critical = false
text_if_listed_critical = "Du hast übermäßig viel in den Kanonenschüssen gestanden."

[boss."15375".mechanic."Sap Bomb (Kite)"]
of = "Sap Bomb"
compare = "share"                # Wert = Anteil des Spielers an allen Flak-Treffern in %
roles = ["Flak Kite"]            # nur für Spieler mit dieser Rolle
min_total = 5                   # nur bewerten, wenn die Gruppe insgesamt mind. 10 Treffer hatte
critical_below = 75              # Meldung, wenn der Anteil UNTER 60 % liegt
text_if_listed_critical = "Als Flak Kite nur {share} % der Sap Bombs abbekommen ({count} von {total}, Platz {rank}) Achte darauf, dass du näher am Kite Spot Richtung Kreis-Marker stehst."

[boss."15375".mechanic."Kick Bomb"]
of = "Kick Bomb"
compare = "share"                # Wert = Anteil des Spielers an allen Flak-Treffern in %
critical_below = 8              # Meldung, wenn der Anteil UNTER 60 % liegt
text_if_listed_critical = "Du hast weniger als 8% der Bomben weggetreten. Achte darauf, dass du sie wegtrittst, wenn du sie bemerkst."


