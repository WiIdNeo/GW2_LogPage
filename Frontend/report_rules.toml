# report_rules.toml - wann ist ein Wert in der Log-Bewertung auffaellig?
# Wird von build_site.py gelesen (--rules). Aenderungen wirken beim naechsten Seitenbau.
#
# Regelarten:  [mechanic."Name"]  [buff."Name"]  [metric.<name>]  [consumables]
# Boss-spezifisch (ersetzt globale Regel gleichen Namens):  [boss."-17194".mechanic."Name"]
#   Boss-ID, bei Challenge Mode negativ (wie in bosses.toml / analysis_filter.toml).
#
# Schluessel einer Regel:
#   critical = 1                  auffaellig, wenn Wert >= 1   (bei Mechaniken Default 1)
#   critical_below = 80           auffaellig, wenn Wert < 80
#   list_if_not_critical = true   auch unauffaelliges auflisten (Mechaniken nur bei Anzahl > 0)
#   text_if_listed_critical       Text bei Auffaelligkeit
#   text_if_listed_not_critical   Text, wenn nur informativ gelistet
#   link                          Link zur Erklaerung
#   professions = ["Firebrand"]   Regel nur fuer diese Professionen / Elite-Spezialisierungen
#   compare = "player"|"total"|"share"   (nur mechanic und metric; Metrik nur dps, breakbar_damage, resurrects)
#       player  Wert des Spielers (Default)
#       total   Summe ueber ALLE Spieler im Log, auch Randoms; Ergebnis steht einmal im Abschnitt "Gruppe"
#       share   Anteil des Spielers an dieser Summe in %; Ergebnis je Spieler
#   min_total = 3                 bei share: nur anwenden, wenn die Gruppensumme >= 3 ist
#   of = "Dead"                   Quelle, falls der Regelname abweicht -> mehrere Regeln pro Mechanik moeglich
# Platzhalter: {value} {count} {threshold} {rule} {player} {account} {character} {time} {times}
#   bei total/share zusaetzlich: {total} (Gruppensumme) {players} (betroffene Spieler) {player_count} {share}
#   Rang (wenn Gruppenwerte vorhanden): {rank} (Platz von oben, 1 = meiste) {rank_bottom} (von unten) {share} {total}
#   {roles} = erkannte Rollen des Spielers
#   roles = ["Tank"] / not_roles = ["Tank"]  Regel nur fuer / nicht fuer Spieler mit dieser Rolle
#   {time} = erstes Auftreten (m:ss), {times} = bis zu 5 Zeitpunkte
# Metriken: dps, breakbar_damage, flanking_percent, resurrects  (Phase 0, Hauptziele)
# Mechaniken (Name) siehe analysis_filter.toml - sie stehen immer in den Daten, auch ohne Regel.

# --- Beispiele (Namen bitte gegen analysis_filter.toml / buffs_info pruefen) ---
# [mechanic."Dead"]
# critical = 1
# list_if_not_critical = false
# text_if_listed_critical = "Du bist {value}x gestorben (zuerst bei {time})."

# [mechanic."Beispiel-Mechanik"]
# critical = 1
# link = "https://wiki.guildwars2.com/wiki/..."
# text_if_listed_critical = "Du wurdest {value}x von Beispiel-Mechanik getroffen ({times}). Das sollte dich nie treffen."

# [buff."Might"]
# critical_below = 15
# text_if_listed_critical = "Wenig Macht ({value} Ø Stacks, erwartet mind. {threshold})."

# [metric.flanking_percent]
# critical_below = 50
# professions = ["Weaver"]
# text_if_listed_critical = "Nur {value}% Flankentreffer."

# [consumables]
# critical_below = 2
# text_if_listed_critical = "Nur {value} Consumable(s) aktiv (Food + Utility erwartet)."

# [boss."-17194".mechanic."Slam"]
# critical = 2

# --- Gruppenwerte (Gesamtmenge ueber alle Spieler; erst fuer Logs, die nach dem Update analysiert wurden) ---
# [mechanic."Dead (Gruppe)"]
# of = "Dead"
# compare = "total"
# critical = 3
# text_if_listed_critical = "Die Gruppe ist {value}x gestorben ({players} von {player_count} Spielern)."

# [mechanic."Dead (Anteil)"]
# of = "Dead"
# compare = "share"
# min_total = 3
# critical = 50
# text_if_listed_critical = "Du hast {share}% aller Tode verursacht ({count} von {total})."

# [metric."DPS-Anteil"]
# of = "dps"
# compare = "share"
# critical_below = 5
# text_if_listed_critical = "Nur {value}% des Gruppenschadens."

# --- Rollen: aus dem Vergleich mit ALLEN Spielern im Log (Platz und Anteil werden beim Einlesen berechnet) ---
# [role."Tank"]
# description = "bekommt die meisten Treffer ab"
# match = "any"                    # any (Default) = ein Kriterium reicht, all = alle muessen zutreffen
# criteria = [
#   { source = "mechanic", name = "Beispiel-Mechanik", top = 1, min_total = 4 },   # Platz 1 von oben, Summe >= 4
#   { source = "mechanic", name = "Andere-Mechanik", share_min = 40 },             # mindestens 40 % aller Ereignisse
# ]
#   Bedingungen: top = N (Platz <= N von oben, Wert > 0) | bottom = N (Platz <= N von unten, Nullen zaehlen mit)
#                share_min / share_max (in %) | min_total (Gruppensumme mindestens, Default 1)
#   source = "metric": dps, breakbar_damage, resurrects
# Boss-spezifisch: [boss."-17194".role."Tank"]
# Die Rolle steht im Bericht mit Beleg (z. B. "Beispiel-Mechanik: 5, 55.6 %, Platz 1 von 10"). Regeln koennen sie
# mit roles / not_roles nutzen, z. B.:
# [mechanic."Beispiel-Mechanik (Tank)"]
# of = "Beispiel-Mechanik"
# roles = ["Tank"]
# critical = 10
# text_if_listed_critical = "Als Tank {value}x getroffen (Platz {rank} von {player_count})."




# Global
    # Mechanics
        [mechanic."Dead"]
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du bist gestorben."

        [mechanic."Downed"]
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du bist {value}x gedownt."

        [mechanic."Launched"]
        of = "Lnch"
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du wurdest geworfen."

        [mechanic."DC"]
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du bist disconectet, kauf dir mal ordentliches Internet!"

        [mechanic."Lckt"]
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du hast im Kampf umgeloggt."

        [mechanic."Knck.Pll"]
        critical = 1
        list_if_not_critical = false
        text_if_listed_critical = "Du wurdest geschubst oder gezogen."

        [mechanic."Res"]
        critical = 1
        not_roles = ["Heal", "Flak Kite", "HK", "Pylon"]
        list_if_not_critical = true
        text_if_listed_critical = "Du hast {value}x wiederbelebt. Insgesamt gab es {gruppe[Downed]} Downs in der Gruppe."

    # Roles
        [role."Alac-Support"]
        criteria = [ { source = "generation", name = "Alacrity", top = 2, value_min = 30 } ]

        [role."Quick-Support"]
        criteria = [ { source = "generation", name = "Quickness", value_min = 30, top = 2 } ]

        [role."BoonDPS"]
        criteria = [{source = "metric", name = "dps", value_min = 5000, roles = ["Alac-Support","Quick-Support"]}]

        [role."Heal"]
        criteria = [{ roles = ["Alac-Support", "Quick-Support"], not_roles = ["BoonDPS"] }]


