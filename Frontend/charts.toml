# charts.toml - Einstellungen fuer die Verlaufs-Charts auf den Spielerseiten (gelesen von build_site.py, --charts)
#
# DPS-Chart je Boss: zwei Linien
#   absolut       DPS auf die Target-Damage-Ziele (wie in der Bewertung)
#   normalisiert  DPS / Faktor  -> "was haette ein normaler DPS-Spieler gemacht"
#
# Faktor = Anteil am Schaden eines normalen DPS (1.0 = voller DPS, 0.8 = 80 %).
#   * Hat ein Spieler mehrere Rollen mit Faktor, werden sie MULTIPLIZIERT (BoonDPS 0.8 * Cannon 0.8 = 0.64).
#   * Rollen ohne Eintrag zaehlen als 1.0.
#   * "*" gilt fuer ALLE Spieler des Bosses (wird zusaetzlich multipliziert).
#   * Statt einer Zahl ist eine Formel (Text) erlaubt, gleiche Syntax wie in report_rules.toml:
#     {Mechanik} / {eigene[Mechanik]} = eigene Anzahl, {buff[Name]}, {metric[dps]} ...
#     Gruppenwerte ({gruppe[..]}, {schnitt[..]}) gibt es hier NICHT. Laesst sich die Formel nicht berechnen
#     oder ist der Faktor <= 0, erscheint der Log nur mit seinem absoluten Wert.
#   * Boss-Abschnitt [boss."<ID>".dps_factor] ergaenzt/ueberschreibt die globalen Faktoren je Rolle.
#     Fehlt fuer einen CM ([boss."-ID"]) ein eigener Abschnitt, gilt der des Normalmodus.
#
# Mechanik-Charts: in report_rules.toml bei der Regel  chart = true  setzen (geht auch bei buff und metric).
# Der Chart zeigt den Wert der Regel je Log (bei of = [..] die Summe, bei share/ratio den Anteil/die Quote)
# und den Schwellwert als gestrichelte Linie.

only_success = true          # nur erfolgreiche Logs in Charts und Tabellen (Wipes verzerren DPS und Mechaniken)
chart_max_logs = 30          # Charts und DPS-Tabelle je Boss zeigen nur die letzten N Logs (Feedback/Rollen: alle)
exclude_roles = ["Heal"]     # Spieler mit einer dieser Rollen erscheinen im DPS-Chart nicht (in der Tabelle schon)

# Feedback je Boss: eine Auffaelligkeit erscheint, wenn sie in MEHR als so vielen Prozent der Logs kritisch war
feedback_min_percent = 10

# "Rollen und Klassen" ganz oben (alle Bosse): nur diese Rollen bilden die Kombinationen, damit boss-spezifische
# Rollen (Cannon, Pylon ...) die Uebersicht nicht zerfasern. In den Boss-Abschnitten zaehlen alle Rollen.
overview_roles = ["Heal", "Alac-Support", "Quick-Support", "BoonDPS", "DPS", "Power-DPS", "Condi-DPS"]

[dps_factor]
BoonDPS = 0.8

