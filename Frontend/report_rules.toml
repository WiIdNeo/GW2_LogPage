# --- Rollen: aus dem Vergleich mit ALLEN Spielern im Log (Platz und Anteil werden beim Einlesen berechnet) ---
# [role."Tank"]
# description = "bekommt die meisten Treffer ab"
# match = "any"                    # any (Default) = ein Kriterium reicht, all = alle muessen zutreffen
# criteria = [
#   { source = "mechanic", name = "Beispiel-Mechanik", top = 1, min_total = 4 },   # Platz 1 von oben, Summe >= 4
#   { source = "mechanic", name = "Andere-Mechanik", share_min = 40 },             # mindestens 40 % aller Ereignisse
# ]
#   Bedingungen: top = N (Platz <= N von oben, Wert > 0) | bottom = N (Platz <= N von unten, Nullen zaehlen mit)
#                share_min / share_max (in %) | min_total (Gruppensumme mindestens, Default 1)
#   source = "metric": dps, breakbar_damage, resurrects
# Boss-spezifisch: [boss."-17194".role."Tank"]
# Die Rolle steht im Bericht mit Beleg (z. B. "Beispiel-Mechanik: 5, 55.6 %, Platz 1 von 10"). Regeln koennen sie
# mit roles / not_roles nutzen, z. B.:
# [mechanic."Beispiel-Mechanik (Tank)"]
# of = "Beispiel-Mechanik"
# roles = ["Tank"]
# critical = 10
# text_if_listed_critical = "Als Tank {value}x getroffen (Platz {rank} von {player_count})."




